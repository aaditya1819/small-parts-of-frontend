<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Login & Registration Form in HTML & CSS </title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <input type="checkbox" id="check">
        <div class="login form">
            <header>Login</header>
            <form action="#">
                <input type="text" placeholder="Enter your email">
                <input type="text" placeholder="Enter your password">
                <a href="#">Forgot password</a>
                <input type="button" class="button" value="Login">
            </form>
            <div class="signup">
                <span class="signup">Don't have a account</span>
                <label for="check" class="label">Sign up</label>
            </div>
        </div>
        <div class="registration form">
            <header>Sign Up</header>
            <form action="#">
                <input type="text" placeholder="Enter your name">
                <input type="text" placeholder="Enter your email">
                <input type="text" placeholder="Create your password">
                
                <input type="button" class="button" value="SignUp">
            </form>
            <div class="signup">
                <span class="signup">Already  have an account</span>
                <label for="check" class="label">Login</label>
            </div>
        </div>

    </div>
    



</body>
</html>
